<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" rx="36" fill="#F5F3FF"/>
  <rect x="84" y="80" width="1112" height="560" rx="24" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="2"/>
  <rect x="150" y="146" width="356" height="40" rx="12" fill="#6D28D9" fill-opacity="0.14"/>

  <!-- Connecting lines -->
  <line x1="640" y1="360" x2="320" y2="260" stroke="#A78BFA" stroke-width="3" stroke-dasharray="6 6"/>
  <line x1="640" y1="360" x2="960" y2="260" stroke="#A78BFA" stroke-width="3" stroke-dasharray="6 6"/>
  <line x1="640" y1="360" x2="320" y2="460" stroke="#A78BFA" stroke-width="3" stroke-dasharray="6 6"/>
  <line x1="640" y1="360" x2="960" y2="460" stroke="#A78BFA" stroke-width="3" stroke-dasharray="6 6"/>
  <line x1="640" y1="360" x2="450" y2="360" stroke="#A78BFA" stroke-width="3" stroke-dasharray="6 6"/>
  <line x1="640" y1="360" x2="830" y2="360" stroke="#A78BFA" stroke-width="3" stroke-dasharray="6 6"/>

  <!-- Center node (one endpoint) -->
  <circle cx="640" cy="360" r="68" fill="#6D28D9"/>
  <circle cx="640" cy="360" r="48" fill="#7C3AED"/>
  <text x="640" y="368" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" text-anchor="middle">UNHOSTED</text>

  <!-- Peripheral nodes: laptops / GPUs / servers -->
  <g>
    <circle cx="320" cy="260" r="42" fill="#EDE9FE" stroke="#7C3AED" stroke-width="3"/>
    <text x="320" y="268" fill="#5B21B6" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" text-anchor="middle">MAC</text>
  </g>
  <g>
    <circle cx="960" cy="260" r="42" fill="#EDE9FE" stroke="#7C3AED" stroke-width="3"/>
    <text x="960" y="268" fill="#5B21B6" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" text-anchor="middle">4090</text>
  </g>
  <g>
    <circle cx="320" cy="460" r="42" fill="#EDE9FE" stroke="#7C3AED" stroke-width="3"/>
    <text x="320" y="468" fill="#5B21B6" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" text-anchor="middle">PI</text>
  </g>
  <g>
    <circle cx="960" cy="460" r="42" fill="#EDE9FE" stroke="#7C3AED" stroke-width="3"/>
    <text x="960" y="468" fill="#5B21B6" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" text-anchor="middle">ROCM</text>
  </g>
  <g>
    <circle cx="450" cy="360" r="36" fill="#EDE9FE" stroke="#7C3AED" stroke-width="3"/>
    <text x="450" y="368" fill="#5B21B6" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="middle">LAN</text>
  </g>
  <g>
    <circle cx="830" cy="360" r="36" fill="#EDE9FE" stroke="#7C3AED" stroke-width="3"/>
    <text x="830" y="368" fill="#5B21B6" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="middle">PEER</text>
  </g>

  <text x="150" y="612" fill="#4C1D95" font-family="Segoe UI, sans-serif" font-size="30" font-weight="600">Decentralized LLM Inference Cluster</text>
</svg>
